<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="洛克图鉴">
  <meta name="theme-color" content="#ffb7c5">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>洛克王国宠物图鉴</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffb7c5 0%, #ffc8d7 50%, #ffe0e8 100%);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
    }
    
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }
    
    .header {
      text-align: center;
      padding: 20px 0 30px;
    }
    
    .logo {
      font-size: 32px;
      font-weight: 800;
      color: #ff6b81;
      text-shadow: 0 2px 10px rgba(255,107,129,0.3);
      margin-bottom: 8px;
    }
    
    .logo-sub {
      font-size: 14px;
      color: rgba(255,107,129,0.6);
    }
    
    .stats-bar {
      background: rgba(255,255,255,0.9);
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 3px 15px rgba(255,107,129,0.15);
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #ff6b81;
    }
    
    .stat-label {
      font-size: 12px;
      color: #999;
    }
    
    .search-box {
      margin-bottom: 20px;
    }
    
    .search-input {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 4px 20px rgba(255,107,129,0.2);
      outline: none;
      transition: all 0.2s ease;
    }
    
    .search-input:focus {
      box-shadow: 0 4px 25px rgba(255,107,129,0.35);
    }
    
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding: 4px 0;
    }
    
    .filter-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.8);
      color: #666;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    
    .filter-btn.active {
      background: #ff6b81;
      color: white;
    }
    
    .filter-btn:active {
      transform: scale(0.95);
    }
    
    .pet-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .pet-card {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 15px rgba(255,107,129,0.15);
      animation: cardFadeIn 0.3s ease;
      position: relative;
    }
    
    @keyframes cardFadeIn {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    
    .pet-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 25px rgba(255,107,129,0.25);
    }
    
    .pet-card.owned {
      background: linear-gradient(135deg, rgba(255,107,129,0.1), rgba(255,183,197,0.2));
      border: 2px solid #ff6b81;
    }
    
    .pet-card:active {
      transform: scale(0.97);
    }
    
    .owned-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: #ff6b81;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
    }
    
    .pet-image {
      width: 80px;
      height: 80px;
      margin: 0 auto 8px;
      border-radius: 12px;
      background: rgba(255,183,197,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .pet-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }
    
    .pet-image .placeholder {
      font-size: 40px;
    }
    
    .pet-emoji-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 16px;
      background: rgba(255,255,255,0.9);
      padding: 4px 8px;
      border-radius: 8px;
    }
    
    .pet-name {
      font-size: 16px;
      font-weight: 700;
      color: #333;
      text-align: center;
      margin-bottom: 6px;
    }
    
    .pet-type {
      font-size: 12px;
      text-align: center;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-block;
      margin: 0 auto;
    }
    
    .pet-location {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 4px;
    }
    
    .type-fire { background: #ffebee; color: #f44336; }
    .type-water { background: #e3f2fd; color: #2196f3; }
    .type-grass { background: #e8f5e9; color: #4caf50; }
    .type-electric { background: #fff8e1; color: #ffc107; }
    .type-ice { background: #e1f5fe; color: #03a9f4; }
    .type-dragon { background: #f3e5f5; color: #9c27b0; }
    .type-ghost { background: #ede7f6; color: #7c4dff; }
    .type-normal { background: #f5f5f5; color: #9e9e9e; }
    .type-light { background: #fff9c4; color: #fbc02d; }
    
    /* 详情页 */
    .detail-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    
    .detail-modal.show {
      display: flex;
    }
    
    .detail-card {
      background: rgba(255,255,255,0.98);
      border-radius: 24px;
      padding: 24px;
      max-width: 380px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      animation: modalPop 0.3s ease;
    }
    
    @keyframes modalPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .detail-header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .detail-image-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: rgba(255,183,197,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    
    .detail-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
    }
    
    .detail-image-container .placeholder {
      font-size: 60px;
    }
    
    .upload-btn {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 32px;
      height: 32px;
      background: #ff6b81;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    
    .upload-btn:hover {
      transform: scale(1.1);
    }
    
    .detail-emoji-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 24px;
      background: rgba(255,255,255,0.9);
      padding: 6px 10px;
      border-radius: 10px;
    }
    
    .detail-name {
      font-size: 28px;
      font-weight: 800;
      color: #333;
      margin-bottom: 8px;
    }
    
    .detail-type {
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 10px;
      display: inline-block;
    }
    
    .own-btn {
      margin-top: 12px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border: 2px solid #ff6b81;
      border-radius: 12px;
      background: transparent;
      color: #ff6b81;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    
    .own-btn.owned {
      background: #ff6b81;
      color: white;
    }
    
    .own-btn:active {
      transform: scale(0.95);
    }
    
    .detail-section {
      margin-bottom: 16px;
    }
    
    .detail-section-title {
      font-size: 14px;
      font-weight: 700;
      color: #ff6b81;
      margin-bottom: 8px;
    }
    
    .detail-section-content {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
    
    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,183,197,0.3);
      padding: 8px 16px;
      border-radius: 12px;
      margin-top: 8px;
    }
    
    .location-icon {
      font-size: 18px;
    }
    
    .location-text {
      font-size: 13px;
      color: #ff6b81;
      font-weight: 600;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    
    .stat-item {
      background: rgba(255,107,129,0.1);
      padding: 8px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-name {
      font-size: 12px;
      color: #999;
    }
    
    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: #ff6b81;
    }
    
    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .skill-tag {
      background: rgba(255,183,197,0.3);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #ff6b81;
    }
    
    .close-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #ff6b81 0%, #ffb7c5 100%);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 16px;
    }
    
    .close-btn:active {
      transform: scale(0.97);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,107,129,0.5);
    }
    
    .empty-emoji {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    /* 文件上传隐藏 */
    .file-input {
      display: none;
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">🦁 洛克图鉴</div>
      <div class="logo-sub">收集你喜爱的宠物伙伴</div>
    </header>
    
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="totalPets">30</div>
        <div class="stat-label">收录</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="ownedPets">0</div>
        <div class="stat-label">已拥有</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="withImage">0</div>
        <div class="stat-label">有图片</div>
      </div>
    </div>
    
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索宠物名称...">
    </div>
    
    <div class="filters" id="filters">
      <button class="filter-btn active" data-type="all">全部</button>
      <button class="filter-btn" data-type="火系">🔥 火系</button>
      <button class="filter-btn" data-type="水系">💧 水系</button>
      <button class="filter-btn" data-type="草系">🌿 草系</button>
      <button class="filter-btn" data-type="电系">⚡ 电系</button>
      <button class="filter-btn" data-type="冰系">❄️ 冰系</button>
      <button class="filter-btn" data-type="龙系">🐉 龙系</button>
      <button class="filter-btn" data-type="幽灵系">👻 幽灵</button>
      <button class="filter-btn" data-type="光系">✨ 光系</button>
    </div>
    
    <div class="pet-grid" id="petGrid"></div>
  </div>
  
  <div class="detail-modal" id="detailModal">
    <div class="detail-card" id="detailCard"></div>
  </div>
  
  <input type="file" class="file-input" id="fileInput" accept="image/*">

  <script src="pets-data.js"></script>
  <script>
    const searchInput = document.getElementById('searchInput');
    const filters = document.getElementById('filters');
    const petGrid = document.getElementById('petGrid');
    const detailModal = document.getElementById('detailModal');
    const detailCard = document.getElementById('detailCard');
    const fileInput = document.getElementById('fileInput');
    const ownedPetsEl = document.getElementById('ownedPets');
    const withImageEl = document.getElementById('withImage');
    
    let currentType = 'all';
    let currentSearch = '';
    let currentPetId = null;
    
    // localStorage 数据
    let ownedData = JSON.parse(localStorage.getItem('rockPets_owned') || '{}');
    let imageDatas = JSON.parse(localStorage.getItem('rockPets_images') || '{}');
    
    function getTypeClass(type) {
      const map = {
        '火系': 'type-fire',
        '水系': 'type-water',
        '草系': 'type-grass',
        '电系': 'type-electric',
        '冰系': 'type-ice',
        '龙系': 'type-dragon',
        '幽灵系': 'type-ghost',
        '普通系': 'type-normal',
        '光系': 'type-light'
      };
      return map[type] || 'type-normal';
    }
    
    function updateStats() {
      const ownedCount = Object.keys(ownedData).length;
      const imageCount = Object.keys(imageDatas).length;
      ownedPetsEl.textContent = ownedCount;
      withImageEl.textContent = imageCount;
    }
    
    function renderPets() {
      let filtered = pets;
      
      if (currentType !== 'all') {
        filtered = filtered.filter(p => p.type === currentType);
      }
      
      if (currentSearch) {
        filtered = filtered.filter(p => 
          p.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
          p.location.toLowerCase().includes(currentSearch.toLowerCase())
        );
      }
      
      if (filtered.length === 0) {
        petGrid.innerHTML = `
          <div class="empty-state" style="grid-column: span 2;">
            <div class="empty-emoji">🔍</div>
            <div>没有找到宠物哦</div>
          </div>
        `;
        return;
      }
      
      petGrid.innerHTML = filtered.map(pet => {
        const isOwned = ownedData[pet.id];
        const imageData = imageDatas[pet.id];
        
        return `
          <div class="pet-card ${isOwned ? 'owned' : ''}" onclick="showDetail(${pet.id})">
            ${isOwned ? '<div class="owned-badge">✓</div>' : ''}
            <div class="pet-emoji-tag">${pet.emoji}</div>
            <div class="pet-image">
              ${imageData ? `<img src="${imageData}" alt="${pet.name}">` : `<div class="placeholder">${pet.emoji}</div>`}
            </div>
            <div class="pet-name">${pet.name}</div>
            <div class="pet-type ${getTypeClass(pet.type)}">${pet.type}</div>
            <div class="pet-location">📍 ${pet.location}</div>
          </div>
        `;
      }).join('');
    }
    
    function showDetail(id) {
      const pet = pets.find(p => p.id === id);
      if (!pet) return;
      
      currentPetId = id;
      const isOwned = ownedData[id];
      const imageData = imageDatas[id];
      const locationInfo = locations[pet.location] || { icon: "📍", desc: "" };
      
      detailCard.innerHTML = `
        <div class="detail-header">
          <div class="detail-image-container">
            <div class="detail-emoji-tag">${pet.emoji}</div>
            ${imageData ? `<img src="${imageData}" alt="${pet.name}">` : `<div class="placeholder">${pet.emoji}</div>`}
            <div class="upload-btn" onclick="uploadImage()">📷</div>
          </div>
          <div class="detail-name">${pet.name}</div>
          <div class="detail-type ${getTypeClass(pet.type)}">${pet.type} · ${pet.rarity}</div>
          <button class="own-btn ${isOwned ? 'owned' : ''}" onclick="toggleOwn(${id})">
            ${isOwned ? '✓ 已拥有' : '标记拥有'}
          </button>
        </div>
        
        <div class="detail-section">
          <div class="detail-section-title">📍 获取地点</div>
          <div class="location-badge">
            <span class="location-icon">${locationInfo.icon}</span>
            <span class="location-text">${pet.location}</span>
          </div>
          <div class="detail-section-content" style="margin-top: 8px;">${pet.obtain}</div>
        </div>
        
        <div class="detail-section">
          <div class="detail-section-title">📝 简介</div>
          <div class="detail-section-content">${pet.description}</div>
        </div>
        
        <div class="detail-section">
          <div class="detail-section-title">📊 属性值</div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-name">生命</div>
              <div class="stat-value">${pet.stats.hp}</div>
            </div>
            <div class="stat-item">
              <div class="stat-name">攻击</div>
              <div class="stat-value">${pet.stats.atk}</div>
            </div>
            <div class="stat-item">
              <div class="stat-name">防御</div>
              <div class="stat-value">${pet.stats.def}</div>
            </div>
            <div class="stat-item">
              <div class="stat-name">魔攻</div>
              <div class="stat-value">${pet.stats.mag}</div>
            </div>
            <div class="stat-item">
              <div class="stat-name">魔抗</div>
              <div class="stat-value">${pet.stats.mdef}</div>
            </div>
            <div class="stat-item">
              <div class="stat-name">速度</div>
              <div class="stat-value">${pet.stats.spd}</div>
            </div>
          </div>
        </div>
        
        <div class="detail-section">
          <div class="detail-section-title">⚡ 技能</div>
          <div class="skill-list">
            ${pet.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
          </div>
        </div>
        
        <div class="detail-section">
          <div class="detail-section-title">🔄 进化路线</div>
          <div class="detail-section-content">${pet.evolution}</div>
        </div>
        
        <button class="close-btn" onclick="closeDetail()">关闭</button>
      `;
      
      detailModal.classList.add('show');
    }
    
    function closeDetail() {
      detailModal.classList.remove('show');
      currentPetId = null;
    }
    
    function toggleOwn(id) {
      if (ownedData[id]) {
        delete ownedData[id];
      } else {
        ownedData[id] = true;
      }
      localStorage.setItem('rockPets_owned', JSON.stringify(ownedData));
      updateStats();
      showDetail(id);
      renderPets();
    }
    
    function uploadImage() {
      if (!currentPetId) return;
      fileInput.click();
    }
    
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !currentPetId) return;
      
      // 压缩图片
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // 创建 canvas 压缩
          const canvas = document.createElement('canvas');
          const maxSize = 200;
          let width = img.width;
          let height = img.height;
          
          if (width > height) {
            if (width > maxSize) {
              height *= maxSize / width;
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width *= maxSize / height;
              height = maxSize;
            }
          }
          
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          // 保存为 base64
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          imageDatas[currentPetId] = dataUrl;
          localStorage.setItem('rockPets_images', JSON.stringify(imageDatas));
          
          updateStats();
          showDetail(currentPetId);
          renderPets();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      
      // 清空 input
      fileInput.value = '';
    });
    
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeDetail();
    });
    
    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderPets();
    });
    
    filters.addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentType = e.target.dataset.type;
        renderPets();
      }
    });
    
    updateStats();
    renderPets();
    
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
